version: '3.8'

services:
  app:
    build: .
    container_name: buysell-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:6432/taskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FILE_UPLOAD_DIR: /tmp/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
    volumes:
      - gradle_cache:/cache/gradle
      - uploads_data:/tmp/uploads
    networks:
      - pg-ha

  postgres-node1:
    build:
      context: ./docker/pacemaker-postgres
    image: buysell-pacemaker-postgres:local
    hostname: pg-node1
    privileged: true
    stop_grace_period: 60s
    environment:
      NODE_NAME: pg-node1
      PG_NODE_HAS_POSTGRES: "true"
      BOOTSTRAP_ROLE: primary
      CLUSTER_BOOTSTRAP: "true"
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password
      PG_CLUSTER_NODE_LIST: "pg-node1 pg-node2"
      PG_INITIAL_PRIMARY: pg-node1
      PG_VOTER_NODE: pg-voter
      PG_VIP: 172.30.0.100
      PG_VIP_CIDR: "24"
      PG_VIP_NIC: eth0
    volumes:
      - postgres-node1-data:/var/lib/postgresql/data
      - cluster-state:/cluster-state
    networks:
      pg-ha:
        ipv4_address: 172.30.0.11
        aliases:
          - pg-node1
    healthcheck:
      test: ["CMD-SHELL", "crm_mon -1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-node2:
    build:
      context: ./docker/pacemaker-postgres
    image: buysell-pacemaker-postgres:local
    hostname: pg-node2
    privileged: true
    stop_grace_period: 60s
    depends_on:
      postgres-node1:
        condition: service_started
    environment:
      NODE_NAME: pg-node2
      PG_NODE_HAS_POSTGRES: "true"
      BOOTSTRAP_ROLE: replica
      CLUSTER_BOOTSTRAP: "false"
      PRIMARY_HOST: pg-node1
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password
      PG_CLUSTER_NODE_LIST: "pg-node1 pg-node2"
      PG_VIP: 172.30.0.100
    volumes:
      - postgres-node2-data:/var/lib/postgresql/data
      - cluster-state:/cluster-state
    networks:
      pg-ha:
        ipv4_address: 172.30.0.12
        aliases:
          - pg-node2
    healthcheck:
      test: ["CMD-SHELL", "crm_mon -1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-voter:
    build:
      context: ./docker/pacemaker-postgres
    image: buysell-pacemaker-postgres:local
    hostname: pg-voter
    privileged: true
    stop_grace_period: 60s
    environment:
      NODE_NAME: pg-voter
      PG_NODE_HAS_POSTGRES: "false"
      CLUSTER_BOOTSTRAP: "false"
    networks:
      pg-ha:
        ipv4_address: 172.30.0.13
        aliases:
          - pg-voter
    healthcheck:
      test: ["CMD-SHELL", "crm_mon -1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-router:
    build:
      context: ./docker/pacemaker-postgres
    image: buysell-pacemaker-postgres:local
    entrypoint: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-db"]
    depends_on:
      postgres-node1:
        condition: service_started
      postgres-node2:
        condition: service_started
      postgres-voter:
        condition: service_started
    ports:
      - "5432:5432"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      pg-ha:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 24

  pgbouncer:
    build:
      context: ./docker/pacemaker-postgres
    image: buysell-pacemaker-postgres:local
    entrypoint: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    user: postgres
    depends_on:
      postgres-router:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      pg-ha:
        ipv4_address: 172.30.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  postgres-node1-data:
  postgres-node2-data:
  cluster-state:
  gradle_cache:
  uploads_data:

networks:
  pg-ha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
