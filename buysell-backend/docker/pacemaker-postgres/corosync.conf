totem {
    version: 2
    cluster_name: buysell-pg
    transport: knet
    crypto_cipher: none
    crypto_hash: none
}

nodelist {
    node {
        name: pg-node1
        nodeid: 1
        ring0_addr: 172.30.0.11
    }

    node {
        name: pg-node2
        nodeid: 2
        ring0_addr: 172.30.0.12
    }

    node {
        name: pg-voter
        nodeid: 3
        ring0_addr: 172.30.0.13
    }
}

quorum {
    provider: corosync_votequorum
}

logging {
    to_stderr: yes
    to_logfile: no
    timestamp: on
}
