spring:
  application:
    name: buysell-backend
  datasource:
    url: jdbc:postgresql://pgbouncer:6432/taskdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    user:
      name: user
      password: pass
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  level:
    ru.prod.buysell: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  port: 8080

file:
  upload-dir: ./uploads
  avatar-file-dir: /avatar
  product-file-dir: /product
  max-size: 10485760
  allowed-types: image/jpeg,image/png,image/webp

jwt:
  secret: 984h489n12n3898h4v9y298n39y493nv839cn839byn893cn893
  lifetime: 86400000
