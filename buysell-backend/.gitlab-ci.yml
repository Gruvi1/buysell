stages:
- test
- build

image: eclipse-temurin:21-jdk-alpine

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_CLEAN_FLAGS: -ffdx -e .gradle/
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

cache:
  key:
    files:
    - gradle/wrapper/gradle-wrapper.properties
  paths:
  - .gradle/wrapper/dists
  - .gradle/caches

before_script:
- chmod +x gradlew
# Безопасное удаление только индексов трансформации, если они заблокированы или повреждены
- rm -rf .gradle/caches/transforms/ .gradle/caches/*/transforms/

test:
  stage: test
  script: ./gradlew test --no-daemon
  cache:
    key:
      files:
      - gradle/wrapper/gradle-wrapper.properties
    paths:
    - .gradle/wrapper/dists
    - .gradle/caches
    policy: pull-push
  artifacts:
    paths:
    - build/reports/checkstyle/
    when: always

docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  before_script: []
  rules:
  - if: $CI_COMMIT_BRANCH == "develop"
  script:
  - mkdir -p /kaniko/.docker
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${IMAGE_TAG}" --destination "${CI_REGISTRY_IMAGE}:latest" --cache=true
